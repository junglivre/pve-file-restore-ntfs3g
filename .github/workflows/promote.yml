name: promote

# Promote a pre-release (testing) to a stable release. Runs in the
# `production` environment, which requires manual approval. Only promote
# after the pre-release was tested on the lab cluster.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote, e.g. file-restore/4.2.8-1+ntfs3g1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Verify assets and promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case $TAG in
            file-restore/*|restore-image/*|dedup-plugin/*|meta/*) ;;
            *) echo "refusing to promote unexpected tag '$TAG'" >&2; exit 1 ;;
          esac

          gh release view "$TAG" --json isPrerelease,tagName
          prerelease=$(gh release view "$TAG" --json isPrerelease --jq .isPrerelease)
          [ "$prerelease" = "true" ] || { echo "$TAG is not a pre-release (already stable?)"; exit 1; }

          # Verify the published SHA256SUMS against the published assets
          # before promoting.
          tmp=$(mktemp -d)
          gh release download "$TAG" --dir "$tmp" --pattern '*.deb' --pattern 'SHA256SUMS'
          (cd "$tmp" && sha256sum -c SHA256SUMS)
          rm -rf "$tmp"

          gh release edit "$TAG" --prerelease=false
          echo "$TAG promoted to stable."

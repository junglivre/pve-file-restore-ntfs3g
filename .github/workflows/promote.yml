name: promote

# Revalidate a testing release and promote it to stable only after the
# protected production environment approves the job.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to promote, e.g. file-restore/4.2.8-1+ntfs3g1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify assets and promote
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: scripts/promote.sh "$TAG"

name: upstream-watch

# Daily: compare upstream versions with upstream.lock and prepare one batched
# review PR. BOT_TOKEN is required for writes: GITHUB_TOKEN-created PRs do not
# trigger CI.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      simulate_from:
        description: 'Comma-separated component=upstream-version pairs; creates a draft PR'
        required: false
        type: string
      dry_run:
        description: 'Check candidates without creating a branch, PR, or issue'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.BOT_TOKEN || github.token }}
      - name: Watch upstream and prepare bump PR
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUSH: '1'
          SIMULATE_FROM: ${{ inputs.simulate_from }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != 1 ]; then
            test -n "$GH_TOKEN" || { echo 'BOT_TOKEN is required' >&2; exit 1; }
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev zstd curl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/upstream-watch.sh
      - name: Keep the schedule alive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUSH: '1'
          KEEPALIVE: '1'
        run: |
          set -euo pipefail
          ./scripts/upstream-watch.sh

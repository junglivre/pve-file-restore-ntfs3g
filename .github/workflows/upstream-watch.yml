name: upstream-watch

# Daily: compare upstream versions with upstream.lock and prepare one batched
# review PR. BOT_TOKEN is required: GITHUB_TOKEN-created PRs do not trigger CI.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      simulate_from:
        description: 'Comma-separated component=upstream-version pairs; creates a draft PR'
        required: false
        type: string
      dry_run:
        description: 'Check candidates without creating a branch, PR, or issue'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Watch upstream and prepare bump PR
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
          PUSH: '1'
          SIMULATE_FROM: ${{ inputs.simulate_from }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" != 1 ]; then
            test -n "$GH_TOKEN" || { echo 'BOT_TOKEN is required' >&2; exit 1; }
            git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          fi
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev zstd curl
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ./scripts/upstream-watch.sh
      - name: Keep the schedule alive
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          GH_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo 'BOT_TOKEN is required' >&2; exit 1; }
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          age_days=$(( (now - last) / 86400 ))
          echo "last commit is $age_days days old"
          if [ "$age_days" -gt 45 ]; then
            mkdir -p status
            date -u +%Y-%m-%dT%H:%M:%SZ > status/last-check
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add status/last-check
            git commit -m "status: keep upstream-watch schedule alive"
            git push
          fi

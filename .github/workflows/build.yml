name: build

# Builds the components whose inputs changed and always runs the complete
# offline test and lint suite. Also called by release.yml.
on:
  pull_request:
  workflow_call:

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      file-restore: ${{ steps.filter.outputs.file-restore }}
      restore-image: ${{ steps.filter.outputs.restore-image }}
      dedup-plugin: ${{ steps.filter.outputs.dedup-plugin }}
      meta: ${{ steps.filter.outputs.meta }}
      smoke: ${{ steps.filter.outputs.smoke }}
      fixture: ${{ steps.filter.outputs.fixture }}
      heavy: ${{ steps.filter.outputs.heavy }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The push base can be several commits back; a shallow clone
          # would make `git diff $base HEAD` fail and skip every build.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          scripts/lib-lock.sh changes --base "$base" >>"$GITHUB_OUTPUT"

  checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install pinned lint tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl xz-utils
          tmp=$(mktemp -d)
          curl -fsSL \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz \
            -o "$tmp/shellcheck.tar.xz"
          shellcheck_sha256=6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
          shellcheck_actual=$(sha256sum "$tmp/shellcheck.tar.xz")
          shellcheck_actual=${shellcheck_actual%% *}
          [ "$shellcheck_actual" = "$shellcheck_sha256" ] || {
            echo 'shellcheck archive checksum mismatch' >&2
            exit 1
          }
          tar -xJf "$tmp/shellcheck.tar.xz" -C "$tmp"
          sudo install -m 0755 "$tmp/shellcheck-v0.10.0/shellcheck" /usr/local/bin/shellcheck
          curl -fsSL \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            -o "$tmp/actionlint.tar.gz"
          actionlint_sha256=023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757
          actionlint_actual=$(sha256sum "$tmp/actionlint.tar.gz")
          actionlint_actual=${actionlint_actual%% *}
          [ "$actionlint_actual" = "$actionlint_sha256" ] || {
            echo 'actionlint archive checksum mismatch' >&2
            exit 1
          }
          tar -xzf "$tmp/actionlint.tar.gz" -C "$tmp"
          sudo install -m 0755 "$tmp/actionlint" /usr/local/bin/actionlint
          shellcheck --version
          actionlint -version
      - name: Run all offline tests and lint
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = '0000000000000000000000000000000000000000' ]; then
            echo 'CI base SHA is unavailable; cannot verify version bumps against the base' >&2
            exit 1
          fi
          git fetch --no-tags origin "$base"
          git rev-parse --verify "$base^{commit}" >/dev/null
          tests/run-all.sh --base "$base"

  build-file-restore:
    needs: changes
    if: needs.changes.outputs.file-restore == 'true'
    runs-on: ubuntu-24.04
    container:
      image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    steps:
      # git must exist inside the container before actions/checkout can run.
      - name: Install git (needed by checkout inside the container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build proxmox-backup-file-restore
        env:
          BUILD_COMPONENT: file-restore
          PROJECT_DIR: ${{ github.workspace }}
          WORK_DIR: ${{ github.workspace }}/.build
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: bash scripts/build-in-container.sh 2>&1 | tee build-file-restore.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-restore
          path: |
            dist/*.deb
            dist/SHA256SUMS
            build-file-restore.log
          if-no-files-found: error
          retention-days: 30

  build-restore-image:
    needs: [changes, build-dedup-plugin]
    if: needs.changes.outputs.restore-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Use the plugin package built by the dependency job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dedup-plugin
          path: dist
      - name: Build proxmox-backup-restore-image
        env:
          WORK_DIR: ${{ github.workspace }}/.build
          OUTPUT_DIR: ${{ github.workspace }}/dist
        run: ./scripts/build.sh --component restore-image 2>&1 | tee build-restore-image.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-image
          path: |
            dist/*.deb
            dist/SHA256SUMS
            build-restore-image.log
          if-no-files-found: error
          retention-days: 30

  build-dedup-plugin:
    needs: changes
    if: needs.changes.outputs.dedup-plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build ntfs-3g-plugin-dedup
        run: ./scripts/build.sh --component dedup-plugin 2>&1 | tee build-dedup-plugin.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dedup-plugin
          path: |
            dist/*.deb
            dist/SHA256SUMS
            build-dedup-plugin.log
          if-no-files-found: error
          retention-days: 30

  build-meta:
    needs: changes
    if: needs.changes.outputs.meta == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pve-file-restore-ntfs3g metapackage
        run: ./scripts/build.sh --component meta 2>&1 | tee build-meta.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta
          path: |
            dist/*.deb
            dist/SHA256SUMS
            build-meta.log
          if-no-files-found: error
          retention-days: 30

  artifact-proofs:
    needs: [changes, checks, build-file-restore, build-restore-image, build-dedup-plugin, build-meta]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download packages built in this run
        if: needs.changes.outputs.file-restore == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: file-restore
          path: artifacts/file-restore
      - name: Download restore image built in this run
        if: needs.changes.outputs.restore-image == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: restore-image
          path: artifacts/restore-image
      - name: Download plugin built in this run
        if: needs.changes.outputs.dedup-plugin == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dedup-plugin
          path: artifacts/dedup-plugin
      - name: Download meta built in this run
        if: needs.changes.outputs.meta == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: meta
          path: artifacts/meta
      - name: Fill missing packages from latest verified releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for component in file-restore restore-image dedup-plugin meta; do
            tests/artifacts/fetch-latest.sh "$component" artifacts
          done
      - name: Verify package artifacts
        env:
          BUILT_FILE_RESTORE: ${{ needs.changes.outputs.file-restore }}
          BUILT_RESTORE_IMAGE: ${{ needs.changes.outputs.restore-image }}
          BUILT_DEDUP_PLUGIN: ${{ needs.changes.outputs.dedup-plugin }}
          BUILT_META: ${{ needs.changes.outputs.meta }}
        run: |
          built_components=()
          [ "$BUILT_FILE_RESTORE" = true ] && built_components+=(file-restore)
          [ "$BUILT_RESTORE_IMAGE" = true ] && built_components+=(restore-image)
          [ "$BUILT_DEDUP_PLUGIN" = true ] && built_components+=(dedup-plugin)
          [ "$BUILT_META" = true ] && built_components+=(meta)
          tests/artifacts/check.sh artifacts "${built_components[@]}"
      - name: Verify the image contains the packaged plugin byte-for-byte
        if: needs.changes.outputs.restore-image == 'true'
        run: |
          set -euo pipefail
          restore_image=$(find artifacts/restore-image -maxdepth 1 -type f \
            -name 'proxmox-backup-restore-image_*.deb' -print)
          plugin=$(find artifacts/dedup-plugin -maxdepth 1 -type f \
            -name 'ntfs-3g-plugin-dedup_*.deb' -print)
          tests/artifacts/plugin-match.sh "$restore_image" "$plugin"
      - name: Verify metapackage dependency resolution
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/artifacts:/artifacts:ro" \
            -v "$PWD/tests/artifacts:/tests/artifacts:ro" \
            debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308 \
            bash /tests/artifacts/meta-apt.sh /artifacts
      - name: Download the published fixture release
        if: needs.changes.outputs.fixture == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p fixture-assets
          gh release download fixtures/ntfs-dedup-2 --repo "${{ github.repository }}" \
            --dir fixture-assets \
            --pattern ntfs-dedup.img.zst \
            --pattern ntfs-dedup.img.zst.sha256 \
            --pattern manifest.sha256 \
            --pattern dedup-files.txt
      - name: Run the fixture with and without the plugin
        if: needs.changes.outputs.fixture == 'true'
        run: |
          set -euo pipefail
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
            -v "$PWD/artifacts:/artifacts:ro" \
            -v "$PWD/fixture-assets:/fixture:ro" \
            -v "$PWD/tests:/tests:ro" \
            debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308 \
            bash -c 'apt-get update -qq && apt-get install -y --no-install-recommends ntfs-3g zstd dpkg && /tests/fixture/ci.sh /artifacts /fixture'
      - name: Run boot smoke
        if: needs.changes.outputs.smoke == 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio qemu-system-x86 qemu-utils initramfs-tools-core binutils socat
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
          tests/smoke/run.sh artifacts

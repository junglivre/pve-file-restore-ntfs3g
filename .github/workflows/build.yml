name: build

# Builds (and tests) exactly the components that changed in upstream.lock,
# patches/ or packaging/. Also called by release.yml.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      file-restore: ${{ steps.filter.outputs.file-restore }}
      restore-image: ${{ steps.filter.outputs.restore-image }}
      dedup-plugin: ${{ steps.filter.outputs.dedup-plugin }}
      meta: ${{ steps.filter.outputs.meta }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The push base can be several commits back; a shallow clone
          # would make `git diff $base HEAD` fail and skip every build.
          fetch-depth: 0
      - id: filter
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          # A reusable call without a push base builds every component.
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
              || [ "${{ github.event_name }}" = workflow_call ]; then
            echo "file-restore=true"  >> "$GITHUB_OUTPUT"
            echo "restore-image=true" >> "$GITHUB_OUTPUT"
            echo "dedup-plugin=true"  >> "$GITHUB_OUTPUT"
            echo "meta=true"          >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD -- upstream.lock patches/ packaging/ scripts/ tests/ || true)
          echo "changed files:"; echo "$changed"
          lock_changed() {
            git diff "$base" HEAD -- upstream.lock | grep -qE "^[+-]$1[[:space:]]"
          }
          common=false
          if grep -qE '^scripts/(build\.sh|build-in-container\.sh|lib-lock\.sh)$' <<<"$changed"; then
            common=true
          fi
          file_restore=false
          restore_image=false
          dedup_plugin=false
          meta=false
          { $common || lock_changed file-restore || grep -qF 'patches/proxmox-backup-ntfs3g-fallback.patch' <<<"$changed"; } && file_restore=true
          { $common || lock_changed dedup-plugin || grep -qF 'patches/ntfs-3g-dedup-plugin-fuse3.patch' <<<"$changed"; } && dedup_plugin=true
          # The plugin is embedded in the restore image, so its lock update
          # must rebuild that image even if the image source pin is unchanged.
          { $common || lock_changed restore-image || $dedup_plugin || grep -qF 'patches/proxmox-backup-restore-image-ntfs3g.patch' <<<"$changed"; } && restore_image=true
          # Boot smoke injects the freshly built daemon into a changed restore
          # image, so an image build also needs the matching daemon artifact.
          $restore_image && file_restore=true

          { $common || lock_changed meta || grep -qF 'packaging/pve-file-restore-ntfs3g/' <<<"$changed"; } && meta=true
          echo "file-restore=$file_restore" >> "$GITHUB_OUTPUT"
          echo "restore-image=$restore_image" >> "$GITHUB_OUTPUT"
          echo "dedup-plugin=$dedup_plugin" >> "$GITHUB_OUTPUT"
          echo "meta=$meta" >> "$GITHUB_OUTPUT"

  build-file-restore:
    needs: changes
    if: needs.changes.outputs.file-restore == 'true'
    runs-on: ubuntu-24.04
    container:
      image: debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308
    steps:
      # git must exist inside the container before actions/checkout can run.
      - name: Install git (needed by checkout inside the container)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build proxmox-backup-file-restore
        env:
          BUILD_COMPONENT: file-restore
          PROJECT_DIR: ${{ github.workspace }}
          WORK_DIR: ${{ github.workspace }}/.build
          OUTPUT_DIR: ${{ github.workspace }}/dist
          DEBFULLNAME: ${{ vars.DEBFULLNAME }}
          DEBEMAIL: ${{ vars.DEBEMAIL }}
        run: |
          set -euo pipefail
          bash scripts/build-in-container.sh 2>&1 | tee build-file-restore.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: file-restore
          path: |
            dist/*.deb
            dist/SHA256SUMS
            build-file-restore.log
          if-no-files-found: error
          retention-days: 30

  build-restore-image:
    needs: changes
    if: needs.changes.outputs.restore-image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Free disk space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h
      - name: Use /mnt for work and docker data
        run: |
          sudo mkdir -p /mnt/work /mnt/docker-data /mnt/dist
          sudo chown -R "$USER:$USER" /mnt/work /mnt/dist
          echo 'WORK_DIR=/mnt/work' >> "$GITHUB_ENV"
          echo 'OUTPUT_DIR=/mnt/dist' >> "$GITHUB_ENV"
          sudo sh -c 'printf "{\"data-root\": \"/mnt/docker-data\"}" > /etc/docker/daemon.json'
          sudo systemctl restart docker
          df -h /mnt
      - name: Build proxmox-backup-restore-image
        env:
          DEBFULLNAME: ${{ vars.DEBFULLNAME }}
          DEBEMAIL: ${{ vars.DEBEMAIL }}
        run: |
          set -euo pipefail
          ./scripts/build.sh --component restore-image 2>&1 | tee build-restore-image.log
      - name: Disk usage after build
        run: df -h
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: restore-image
          path: |
            /mnt/dist/*.deb
            /mnt/dist/SHA256SUMS
            build-restore-image.log
          if-no-files-found: error
          retention-days: 30

  build-dedup-plugin:
    needs: changes
    if: needs.changes.outputs.dedup-plugin == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build ntfs-3g-plugin-dedup
        run: |
          set -euo pipefail
          ./scripts/build.sh --component dedup-plugin 2>&1 | tee build-dedup-plugin.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dedup-plugin
          path: |
            dist/*.deb
            dist/SHA256SUMS
            build-dedup-plugin.log
          if-no-files-found: error
          retention-days: 30

  build-meta:
    needs: changes
    if: needs.changes.outputs.meta == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build pve-file-restore-ntfs3g metapackage
        run: |
          set -euo pipefail
          ./scripts/build.sh --component meta 2>&1 | tee build-meta.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: meta
          path: |
            dist/*.deb
            dist/SHA256SUMS
            build-meta.log
          if-no-files-found: error
          retention-days: 30

  test:
    needs: [changes, build-file-restore, build-restore-image, build-dedup-plugin, build-meta]
    if: >-
      always() && !cancelled() && !contains(needs.*.result, 'failure') &&
      (needs.changes.outputs.file-restore == 'true' ||
       needs.changes.outputs.restore-image == 'true' ||
       needs.changes.outputs.dedup-plugin == 'true' ||
       needs.changes.outputs.meta == 'true')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Installer and checker shell tests
        run: |
          set -euo pipefail
          tests/cluster-install/test.sh
          tests/check-command/test.sh
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Static checks (daemon, initramfs, Provides)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils initramfs-tools-core

          fr=$(find artifacts/file-restore -name 'proxmox-backup-file-restore_*.deb' 2>/dev/null | head -1 || true)
          ri=$(find artifacts/restore-image -name 'proxmox-backup-restore-image_*.deb' 2>/dev/null | head -1 || true)

          if [ -n "$fr" ]; then
            echo "== file-restore checks: $fr"
            dpkg-deb -I "$fr" | grep -q 'Provides: proxmox-backup-file-restore-ntfs3g'
            dpkg-deb -I "$fr" | grep -q 'Maintainer: pve-file-restore-ntfs3g'

            tmp=$(mktemp -d)
            dpkg-deb -x "$fr" "$tmp"
            grep -qF 'try FUSE mount using ntfs-3g' \
              < <(strings "$tmp/usr/lib/x86_64-linux-gnu/proxmox-backup/file-restore/proxmox-restore-daemon")
            grep -qF 'remounting with ntfs-3g' \
              < <(strings "$tmp/usr/lib/x86_64-linux-gnu/proxmox-backup/file-restore/proxmox-restore-daemon")
            zcat "$tmp/usr/share/doc/proxmox-backup-file-restore/changelog.Debian.gz" \
              | grep -qF 'Rebuild with the pve-file-restore-ntfs3g patch set.'

            rm -rf "$tmp"
          fi

          if [ -n "$ri" ]; then
            echo "== restore-image checks: $ri"
            dpkg-deb -I "$ri" | grep -q 'Provides: proxmox-backup-restore-image-ntfs3g'
            dpkg-deb -I "$ri" | grep -q 'Maintainer: pve-file-restore-ntfs3g'

            tmp=$(mktemp -d)
            dpkg-deb -x "$ri" "$tmp"
            img="$tmp/usr/lib/x86_64-linux-gnu/proxmox-backup/file-restore/initramfs.img"
            grep -qx 'usr/bin/ntfs-3g' < <(lsinitramfs "$img")
            grep -qx 'usr/lib/x86_64-linux-gnu/ntfs-3g/ntfs-plugin-80000013.so' < <(lsinitramfs "$img")
            grep -q 'libfuse3' < <(lsinitramfs "$img")
            zcat "$tmp/usr/share/doc/proxmox-backup-restore-image/changelog.Debian.gz" \
              | grep -qF 'Rebuild with the pve-file-restore-ntfs3g patch set.'
            rm -rf "$tmp"
          fi

          meta=$(find artifacts/meta -name 'pve-file-restore-ntfs3g_*.deb' 2>/dev/null | head -1 || true)
          if [ -n "$meta" ]; then
            echo "== meta checks: $meta"
            dpkg-deb -I "$meta" | grep -q 'Depends: proxmox-backup-file-restore-ntfs3g'
            dpkg-deb -I "$meta" | grep -q 'proxmox-backup-restore-image-ntfs3g'
          fi
      - name: Metapackage dependency test
        run: |
          set -euo pipefail
          meta=$(find artifacts/meta -name 'pve-file-restore-ntfs3g_*.deb' 2>/dev/null | head -1 || true)
          [ -n "$meta" ] || { echo "meta package not built in this run, skipping"; exit 0; }
          fr=$(find artifacts/file-restore -name 'proxmox-backup-file-restore_*.deb' 2>/dev/null | head -1 || true)
          ri=$(find artifacts/restore-image -name 'proxmox-backup-restore-image_*.deb' 2>/dev/null | head -1 || true)
          [ -n "$fr" ] && [ -n "$ri" ] || { echo "patched packages not in this run, skipping"; exit 0; }

          docker run --rm -v "$PWD/artifacts:/artifacts:ro" \
            debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends cpio dpkg-dev
              meta=$(find /artifacts/meta -name "pve-file-restore-ntfs3g_*.deb" | head -1)
              fr=$(find /artifacts/file-restore -name "proxmox-backup-file-restore_*.deb" | head -1)
              ri=$(find /artifacts/restore-image -name "proxmox-backup-restore-image_*.deb" | head -1)
              fr_version=$(dpkg-deb -f "$fr" Version)
              ri_version=$(dpkg-deb -f "$ri" Version)
              fr_upstream=${fr_version%+ntfs3g*}
              ri_upstream=${ri_version%+ntfs3g*}
              echo "deb [trusted=yes] http://download.proxmox.com/debian/pve trixie pve-no-subscription" >/etc/apt/sources.list.d/proxmox.list
              apt-get update -qq
              mkdir -p /repo/official /repo/patched
              (cd /repo/official && apt-get download \
                "proxmox-backup-file-restore=$fr_upstream" \
                "proxmox-backup-restore-image=$ri_upstream")
              cp "$fr" "$ri" "$meta" /repo/patched/
              for repo in /repo/official /repo/patched; do
                (cd "$repo" && dpkg-scanpackages . /dev/null | gzip -9c > Packages.gz)
              done
              echo "deb [trusted=yes] file:/repo/official ./" >/etc/apt/sources.list.d/official-local.list
              apt-get update -qq
              # The official packages are present, but do not provide the
              # patched virtual dependencies, so meta alone must be refused.
              if apt-get install -y --no-install-recommends "$meta"; then
                echo "metapackage installed with only official packages: FAIL" >&2
                exit 1
              fi
              echo "deb [trusted=yes] file:/repo/patched ./" >/etc/apt/sources.list.d/patched-local.list
              apt-get update -qq
              apt-get install -y --no-install-recommends pve-file-restore-ntfs3g
            '
      - name: Dedup plugin fixture test
        run: |
          set -euo pipefail
          if [ ! -f tests/fixtures/ntfs-dedup.img.zst ]; then
            echo "::error::missing required synthetic Windows Data Dedup fixture: tests/fixtures/ntfs-dedup.img.zst (see tests/README.md)"
            exit 1
          fi
          deb=$(find artifacts/dedup-plugin -name 'ntfs-3g-plugin-dedup_*.deb' 2>/dev/null | head -1 || true)
          [ -n "$deb" ] || { echo "plugin not built in this run, skipping"; exit 0; }
          docker run --rm --device /dev/fuse --cap-add SYS_ADMIN \
            -v "$PWD:/repo:ro" \
            debian:13@sha256:4c25275446ca371766b8b093c696782eabce06263fccacb8d5d813b3dc44b308 \
            bash -euxo pipefail -c '
              export DEBIAN_FRONTEND=noninteractive
              apt-get update -qq
              apt-get install -y --no-install-recommends ntfs-3g zstd
              deb=$(find /repo/artifacts/dedup-plugin -name "ntfs-3g-plugin-dedup_*.deb" | head -1)
              dpkg -i "$deb"
              zstd -d /repo/tests/fixtures/ntfs-dedup.img.zst -o /tmp/ntfs-dedup.img
              mkdir -p /mnt/dedup
              ntfs-3g -o ro /tmp/ntfs-dedup.img /mnt/dedup
              cd /mnt/dedup
              sha256sum -c /repo/tests/fixtures/ntfs-dedup.sha256
            '
      - name: Boot smoke test (QEMU)
        run: |
          set -euo pipefail
          ri=$(find artifacts/restore-image -name 'proxmox-backup-restore-image_*.deb' 2>/dev/null | head -1 || true)
          fr=$(find artifacts/file-restore -name 'proxmox-backup-file-restore_*.deb' 2>/dev/null | head -1 || true)
          [ -n "$ri" ] && [ -n "$fr" ] || { echo "restore image or daemon not built in this run, skipping"; exit 0; }
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cpio qemu-system-x86 qemu-utils
          sudo chmod 666 /dev/kvm || true
          tmp=$(mktemp -d)
          dpkg-deb -x "$ri" "$tmp/restore-image"
          dpkg-deb -x "$fr" "$tmp/file-restore"
          kernel="$tmp/restore-image/usr/lib/x86_64-linux-gnu/proxmox-backup/file-restore/bzImage"
          initrd="$tmp/restore-image/usr/lib/x86_64-linux-gnu/proxmox-backup/file-restore/initramfs.img"
          # The upstream image deliberately omits the daemon. Append a second
          # newc archive with the freshly built daemon, matching how the PVE
          # restore path supplies it, so this asserts actual daemon startup.
          mkdir "$tmp/inject"
          install -m 0755 \
            "$tmp/file-restore/usr/lib/x86_64-linux-gnu/proxmox-backup/file-restore/proxmox-restore-daemon" \
            "$tmp/inject/proxmox-restore-daemon"
          (cd "$tmp/inject" && find . -print0 | cpio --null -o --format=newc) >> "$initrd"
          set +e
          timeout 120 qemu-system-x86_64 \
            -enable-kvm -m 1024 -nographic -no-reboot \
            -kernel "$kernel" -initrd "$initrd" \
            -append "console=ttyS0" > qemu-boot.log 2>&1
          rc=$?
          set -e
          cat qemu-boot.log
          ! grep -qi 'kernel panic' qemu-boot.log
          ! grep -qi '/proxmox-restore-daemon missing from image' qemu-boot.log
          grep -qF '[init-shim] reached daemon start' qemu-boot.log

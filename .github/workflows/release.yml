name: release

# Build on lock changes and publish immutable testing releases. Promotion is a
# separate approval-gated workflow (promote.yml).
on:
  push:
    branches: [master]
    paths: [upstream.lock]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
      - name: Publish pre-releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: scripts/release.sh artifacts

  release-failure:
    needs: [build, release]
    if: >-
      always() && (needs.build.result == 'failure' || needs.release.result == 'failure')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Comment on the release-failure tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          body=$(printf 'Release workflow failed for commit %s. Inspect the failed build/release jobs.' "$RELEASE_SHA")
          issue=$(gh issue list --repo "$GH_REPO" --state open --label release-failure \
            --json number --jq '.[0].number')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$GH_REPO" --body "$body"
          else
            gh label create release-failure --repo "$GH_REPO" --force
            gh issue create --repo "$GH_REPO" --title 'Release failure tracking' \
              --label release-failure --body "$body"
          fi

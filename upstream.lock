# Single source of truth for what this repository builds.
#
# One line per component (fields separated by whitespace):
#
#   <component>  <package version>  <upstream commit>  <patches>  <inputs sha256>  <source>
#
# - package version: exact upstream version + our "+ntfs3g<N>" suffix (D6), or
#   the package's own version for dedup-plugin and meta.
# - upstream commit: full commit hash of the upstream release commit. For
#   proxmox-backup and proxmox-backup-restore-image this MUST be the commit
#   titled "bump version to <upstream version>" (find it with
#   scripts/resolve-upstream.sh); never a master tip. For dedup-plugin it is
#   the pinned commit of smx-smx/ntfs-3g-dedup-plugin.
# - patches: comma-separated repo-relative patch paths applied in that order,
#   or "-" when there are none.
# - inputs sha256: hash of all tracked inputs that shape the package, as listed
#   by scripts/lib-lock.sh.
# - source: upstream git URL and ref separated by the last "#".
#
# Debian ordering guarantee: 4.2.8-1 < 4.2.8-1+ntfs3g1 < 4.2.8-2. No epoch.

